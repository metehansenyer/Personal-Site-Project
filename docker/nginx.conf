# Replaces /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (included inside http{}).

# Cache policy by path. Evaluated against $uri, so after an error_page internal redirect
# the 404 page is served as /404.html (no-cache).
map $uri $cache_control {
    default                                  "no-cache";
    ~^/_astro/                               "public, max-age=31536000, immutable";
    ~*\.(?:ico|png|jpe?g|webp|avif|gif|svg|woff2?)$ "public, max-age=86400";
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /app/dist;
    index index.html;

    server_tokens off;
    # Never build redirects with nginx's own host/port (we sit behind Traefik).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml;

    # No CSP on purpose: the site loads the Font Awesome kit, Umami and jsDelivr images.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Astro build.format 'directory': /about -> dist/about/index.html. Trying
    # $uri/index.html explicitly avoids nginx's automatic 301 from /about to /about/.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
