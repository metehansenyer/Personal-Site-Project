name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual start from the Actions tab, e.g. to re-test main after a run failed to start.
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit is tested: a newer run for the same pull request, or a newer push to
# main, cancels the older run. Runs left over for a closed pull request are cancelled by
# cancel-stale-runs.yml.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check internal links
        run: pnpm check:links

  docker:
    name: docker (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t site .

      - name: Start container
        run: docker run -d -p 3000:3000 --name site site

      - name: Smoke test
        run: bash scripts/smoke-test.sh http://127.0.0.1:3000

      - name: Container logs
        if: failure()
        run: docker logs site
