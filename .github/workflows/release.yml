name: Release

# Creates GitHub Releases.
# - Pushing a tag like v2.1.0 creates its release. Notes come from .github/releases/<tag>.md
#   when that file exists, otherwise GitHub generates them from the merged PRs.
# - Running it manually (workflow_dispatch) creates a release for every notes file that has
#   none yet, oldest first. A missing tag is created on the commit the workflow runs on.
# The first line of a notes file ("# <title>") is the release title; the rest is the body.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          create() {
            local tag="$1" file=".github/releases/$1.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: release already exists, skipping"
              return
            fi
            local args=("$tag")
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              args+=(--verify-tag)
            else
              args+=(--target "$GITHUB_SHA")
            fi
            if [ -f "$file" ]; then
              local title body
              title=$(head -n 1 "$file" | sed 's/^# *//')
              body=$(mktemp)
              tail -n +2 "$file" > "$body"
              args+=(--title "$title" --notes-file "$body")
            else
              args+=(--title "$tag" --generate-notes)
            fi
            gh release create "${args[@]}"
            echo "$tag: release created"
          }

          if [ "$EVENT" = "push" ]; then
            create "$TAG"
          else
            for tag in $(ls .github/releases/ | sed -n 's/\.md$//p' | sort -V); do
              create "$tag"
            done
          fi
